<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUNU KIDS</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/product.css">
<script type="module" src="js/pages/product.js"></script>
</head>
<body class="page-product">

<main>
  <div class="container">
    <nav class="crumbs" id="crumbs" aria-label="مسار الصفحة"></nav>
    <div class="pdp" id="pdp"></div>
  </div>

  <section class="section" id="upsell" hidden></section>

  <section class="section" id="recent" hidden>
    <div class="container">
      <div class="section__head section__head--row"><div><h2>شفتيها مؤخراً</h2></div></div>
      <div class="products" id="recentGrid"></div>
    </div>
  </section>

  <section class="section section--tint" id="related">
    <div class="container">
      <div class="section__head section__head--row">
        <div><h2>ممكن يعجبك كمان</h2><p>اخترناهم إلك حسب اللي شفتيه ومقاس البيبي</p></div>
      </div>
      <div class="products" id="relatedGrid"></div>
    </div>
  </section>
</main>

<!-- شريط الإضافة للسلة على الموبايل -->
<div class="buybar" id="buybar"></div>

<dialog class="modal" id="sizeGuide">
  <div class="modal__head">
    <h3>دليل المقاسات</h3>
    <button type="button" class="icon-btn" data-close aria-label="إغلاق">✕</button>
  </div>
  <table class="size-table">
    <thead><tr><th>المقاس</th><th>الوزن</th><th>الطول</th></tr></thead>
    <tbody id="sizeGuideBody"></tbody>
  </table>
  <p class="modal__note">نصيحة: إذا البيبي على حدود مقاسين، اختاري المقاس الأكبر لأنه بيكبر بسرعة.</p>
</dialog>

</body>
</html>
