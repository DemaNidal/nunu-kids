<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUNU KIDS</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/product.css">
</head>
<body class="page-product">

<main>
  <div class="container">
    <nav class="crumbs" id="crumbs" aria-label="مسار الصفحة"></nav>
    <div class="pdp" id="pdp"></div>
  </div>

  <section class="section" id="upsell" hidden></section>

  <section class="section" id="recent" hidden>
    <div class="container">
      <div class="section__head section__head--row"><div><h2>شفتيها مؤخراً</h2></div></div>
      <div class="products" id="recentGrid"></div>
    </div>
  </section>

  <section class="section section--tint" id="related">
    <div class="container">
      <div class="section__head section__head--row">
        <div><h2>ممكن يعجبك كمان</h2><p>اخترناهم إلك حسب اللي شفتيه ومقاس البيبي</p></div>
      </div>
      <div class="products" id="relatedGrid"></div>
    </div>
  </section>
</main>

<!-- شريط الإضافة للسلة على الموبايل -->
<div class="buybar" id="buybar"></div>

<!-- دليل المقاسات -->
<dialog class="modal" id="sizeGuide">
  <div class="modal__head">
    <h3>دليل المقاسات</h3>
    <button class="icon-btn" data-close aria-label="إغلاق"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <table class="size-table">
    <thead><tr><th>المقاس</th><th>الوزن</th><th>الطول</th></tr></thead>
    <tbody>
      <tr><td><bdi dir="ltr">0–3</bdi> أشهر</td><td><bdi dir="ltr">3 – 6</bdi> كغ</td><td><bdi dir="ltr">50 – 62</bdi> سم</td></tr>
      <tr><td><bdi dir="ltr">3–6</bdi> أشهر</td><td><bdi dir="ltr">6 – 8</bdi> كغ</td><td><bdi dir="ltr">62 – 68</bdi> سم</td></tr>
      <tr><td><bdi dir="ltr">6–9</bdi> أشهر</td><td><bdi dir="ltr">8 – 9.5</bdi> كغ</td><td><bdi dir="ltr">68 – 74</bdi> سم</td></tr>
      <tr><td><bdi dir="ltr">9–12</bdi> شهر</td><td><bdi dir="ltr">9.5 – 11</bdi> كغ</td><td><bdi dir="ltr">74 – 80</bdi> سم</td></tr>
    </tbody>
  </table>
  <p class="modal__note">نصيحة: إذا البيبي على حدود مقاسين، اختاري المقاس الأكبر لأنه بيكبر بسرعة.</p>
</dialog>

<script src="js/data.js"></script>
<script src="js/recs.js"></script>
<script src="js/layout-markup.js"></script>
<script src="js/layout.js"></script>
<script src="js/product.js"></script>
</body>
</html>
