<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إتمام الطلب | NUNU KIDS</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/checkout.css">
<script src="js/file-warning.js"></script>
<script type="module" src="js/pages/checkout.js"></script>
</head>
<body class="page-checkout">

<main class="container checkout" id="checkout">
  <h1 class="checkout__title">إتمام الطلب</h1>

  <div class="checkout__grid">
    <!-- النموذج -->
    <form class="co-form" id="coForm" novalidate>
      <section class="co-card">
        <h2><span class="step">1</span> معلوماتك</h2>
        <div class="field">
          <label for="fName">الاسم الكامل</label>
          <input id="fName" name="name" autocomplete="name" placeholder="مثلاً: سارة أحمد" required>
          <p class="field__err"></p>
        </div>
        <div class="field">
          <label for="fPhone">رقم الموبايل</label>
          <input id="fPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="05X XXX XXXX" required>
          <p class="field__hint">رح نتصل فيكِ على هاد الرقم لتأكيد الطلب</p>
          <p class="field__err"></p>
        </div>
      </section>

      <section class="co-card">
        <h2><span class="step">2</span> عنوان التوصيل</h2>
        <div class="field">
          <label>المنطقة</label>
          <div class="zones" id="zones" role="radiogroup"></div>
          <p class="field__err" id="zoneErr"></p>
        </div>
        <div class="field">
          <label for="fCity">المدينة أو القرية</label>
          <input id="fCity" name="city" autocomplete="address-level2" placeholder="مثلاً: رام الله" required>
          <p class="field__err"></p>
        </div>
        <div class="field">
          <label for="fAddress">العنوان بالتفصيل</label>
          <input id="fAddress" name="address" autocomplete="street-address" placeholder="الحي، الشارع، أقرب معلم" required>
          <p class="field__err"></p>
        </div>
        <div class="field">
          <label for="fNotes">ملاحظات <small>(اختياري)</small></label>
          <textarea id="fNotes" name="notes" rows="2" placeholder="مثلاً: بدي الطلب مغلف كهدية، أو اتصلوا قبل بساعة"></textarea>
        </div>
      </section>

      <section class="co-card">
        <h2><span class="step">3</span> طريقة الدفع</h2>
        <label class="pay-opt">
          <input type="radio" name="payment" value="cod" checked>
          <i data-icon="cash"></i>
          <div><b>الدفع نقداً عند الاستلام</b><small>بتدفعي للمندوب لما يوصلك الطلب</small></div>
        </label>
      </section>
    </form>

    <!-- الملخص -->
    <aside class="co-summary" id="summary"></aside>
  </div>
</main>

<!-- شريط التأكيد على الموبايل -->
<div class="co-bar" id="coBar"></div>

</body>
</html>
