<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUNU KIDS | ملابس المواليد</title>
<meta name="description" content="نونو كيدز: ملابس المواليد من الولادة حتى عمر سنة، وبكجات تجهيز البيبي. الدفع عند الاستلام.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/home.css">
<script type="module" src="js/pages/home.js"></script>
</head>
<body>

<main>
  <!-- البانر الرئيسي -->
  <section class="hero" id="offers">
    <div class="hero__photos" id="heroPhotos"></div>
    <div class="hero__overlay"><div class="hero__text" id="heroText"></div></div>
  </section>

  <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>

  <section class="trust"><div class="container trust__row" id="trust"></div></section>

  <section class="section" id="ages">
    <div class="container">
      <div class="section__head">
        <h2>تسوقي حسب العمر</h2>
        <p>اختاري عمر البيبي، وبنوريكي المقاسات المناسبة إله</p>
      </div>
      <div class="ages" id="agesGrid"></div>
    </div>
  </section>

  <section class="section section--tint" id="new">
    <div class="container">
      <div class="section__head section__head--row">
        <div><h2>وصل حديثاً</h2><p>أحدث القطع اللي نزلت عالمتجر</p></div>
        <a href="#" class="link-more">شوفي الكل ←</a>
      </div>
      <div class="products" id="newGrid"></div>
    </div>
  </section>

  <!-- بتظهر بس للزبونة اللي تصفحت قبل -->
  <section class="section" id="forYou" hidden>
    <div class="container">
      <div class="section__head section__head--row">
        <div><h2>مختارات إلك</h2><p>حسب اللي عجبك ومقاس البيبي</p></div>
      </div>
      <div class="products" id="forYouGrid"></div>
    </div>
  </section>

  <section class="section" id="bundles">
    <div class="container">
      <div class="section__head">
        <h2>بكجات تجهيز البيبي</h2>
        <p>كل اللي بتحتاجيه للبيبي بطلب واحد، وبسعر أقل من شراء كل قطعة لحالها</p>
      </div>
      <div class="bundles" id="bundleGrid"></div>
    </div>
  </section>

  <!-- بيظهر بس إذا في عرض فعّال محدد كـ banner -->
  <section class="container" id="promo" hidden></section>

  <section class="section" id="types">
    <div class="container">
      <div class="section__head"><h2>تسوقي حسب النوع</h2></div>
      <div class="types" id="typesGrid"></div>
    </div>
  </section>

  <section class="section section--tint">
    <div class="container">
      <div class="section__head"><h2>شو حكوا الأمهات عنا</h2></div>
      <div class="reviews" id="reviewsGrid"></div>
    </div>
  </section>
</main>

</body>
</html>
