<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلبات | لوحة تحكم NUNU KIDS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3EFEC">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/admin.css">
<script type="module" src="../js/admin/orders.js"></script>
</head>
<body class="admin">

<main class="adm-main">
  <div class="adm-head">
    <div>
      <span class="eyebrow" id="today"></span>
      <h1>الطلبات</h1>
    </div>
    <!-- طباعة ملصقات كل الطلبات المؤكدة دفعة وحدة (قبل ما تسلميها للمندوب) -->
    <button type="button" class="btn btn--sm btn--ghost" id="printConfirmed" hidden></button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="adm-tools">
    <div class="adm-tabs" id="tabs" role="tablist" aria-label="حالة الطلب"></div>
    <label class="adm-search">
      <svg class="ic ic--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input type="search" id="search" placeholder="رقم الطلب، الاسم، الجوال أو المدينة" aria-label="بحث بالطلبات">
    </label>
  </div>

  <div class="olist" id="orders"></div>
</main>

<!-- تفاصيل الطلب -->
<div class="adm-scrim" id="odScrim"></div>
<aside class="od" id="od" aria-label="تفاصيل الطلب"></aside>

</body>
</html>
