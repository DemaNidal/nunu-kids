<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية | لوحة تحكم NUNU KIDS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3EFEC">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/admin.css">
<script type="module" src="../js/admin/dashboard.js"></script>
</head>
<body class="admin">

<main class="adm-main">
  <div class="adm-head adm-head--dash">
    <div>
      <span class="eyebrow" id="today"></span>
      <h1>أهلاً فيكِ ♡</h1>
    </div>
    <div class="seg" id="period" role="group" aria-label="الفترة"></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="dash-grid">
    <div>
      <section class="panel">
        <div class="panel__head"><h2 id="chartTitle">المبيعات اليومية</h2><small>بدون الطلبات الملغية</small></div>
        <div class="chart" id="salesChart"></div>
        <details class="chart-table" id="salesTable"></details>
      </section>

      <section class="panel">
        <div class="panel__head"><h2>الأكثر مبيعاً</h2><small>بالفترة المختارة</small></div>
        <div id="topProducts"></div>
      </section>
    </div>

    <div>
      <section class="panel" id="attentionPanel">
        <div class="panel__head"><h2>بدها انتباهك</h2><a href="orders.html" id="attentionCount"></a></div>
        <div id="attention"></div>
      </section>

      <section class="panel">
        <div class="panel__head"><h2>قرّب يخلص</h2><small>مقاسات باقي منها قطعتين أو أقل</small></div>
        <div id="lowStock"></div>
      </section>

      <section class="panel">
        <div class="panel__head"><h2>الطلبات حسب المنطقة</h2></div>
        <div id="zones"></div>
      </section>
    </div>
  </div>
</main>

</body>
</html>
