<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كل المنتجات | NUNU KIDS</title>
<meta name="description" content="تسوقي ملابس المواليد من NUNU KIDS حسب العمر واللون والسعر. الدفع عند الاستلام.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/shop.css">
<script src="js/file-warning.js"></script>
<script type="module" src="js/pages/shop.js"></script>
</head>
<body class="page-shop">

<main class="container shop">
  <nav class="crumbs" aria-label="مسار الصفحة"><a href="index.html">الرئيسية</a><span>/</span><b id="crumbTitle">كل المنتجات</b></nav>

  <div class="shop__head">
    <span class="eyebrow" id="shopEyebrow">تسوقي براحتك</span>
    <h1 id="shopTitle">كل المنتجات</h1>
  </div>

  <!-- تبويبات الأقسام -->
  <div class="shop-tabs" id="tabs" role="tablist" aria-label="الأقسام"></div>

  <div class="shop__layout">
    <!-- الفلاتر: جانبية على الكمبيوتر، ونافذة من تحت على الموبايل -->
    <aside class="filters" id="filters" aria-label="الفلاتر">
      <div class="filters__head">
        <h2>فلترة</h2>
        <button type="button" class="icon-btn only-mobile" data-close-filters aria-label="إغلاق">✕</button>
      </div>
      <div id="filterGroups"></div>
      <div class="filters__foot only-mobile">
        <button type="button" class="btn btn--primary btn--block" data-close-filters id="showResults">عرض النتائج</button>
      </div>
    </aside>
    <div class="filters-overlay only-mobile" id="filtersOverlay" data-close-filters></div>

    <section class="shop__results" aria-live="polite">
      <div class="toolbar">
        <button type="button" class="btn btn--ghost btn--sm only-mobile" id="openFilters">فلترة <span class="toolbar__badge" id="filterCount" hidden></span></button>
        <span class="toolbar__count" id="resultCount"></span>
        <label class="toolbar__sort">
          <span class="only-desktop">ترتيب:</span>
          <select id="sort" aria-label="ترتيب المنتجات">
            <option value="featured">المميزة</option>
            <option value="new">الأحدث</option>
            <option value="price-asc">السعر: من الأقل</option>
            <option value="price-desc">السعر: من الأعلى</option>
            <option value="discount">أكبر خصم</option>
          </select>
        </label>
      </div>
      <div class="active-filters" id="activeFilters"></div>
      <div class="products" id="grid"></div>
    </section>
  </div>
</main>

</body>
</html>
